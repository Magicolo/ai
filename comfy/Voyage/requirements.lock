# Voyage slim-image dependency lock (issue 011, freeze-record).
#
# Recorded 2026-09-25 via `docker run --rm voyage:latest pip freeze`
# (slim image, Python 3.12). The slim Dockerfile installs this file first
# (`pip install -r requirements.lock`), so rebuilds are byte-identical for
# every package — including transitives that pyproject.toml only floors.
# Direct (= human-owned) pins live in pyproject.toml; this file is the
# machine-recorded transitive closure. The two must agree on direct deps.
#
# Regenerate after any deliberate upgrade:
#   docker build -t voyage:latest .
#   docker run --rm voyage:latest pip freeze | grep -v '^-e ' > requirements.lock
#
# Worker images (video/director) carry different stacks (torch/CUDA/Qwen)
# and are pinned separately in worker/Dockerfile.* — this lock is slim-only.

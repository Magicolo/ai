[project]
name = "voyage"
version = "0.1.0"
description = "Autonomous infinite audiovisual voyage — supervisor + workers (Phase 0 skeleton)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "huggingface_hub>=0.23",
  "numpy>=1.26",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
voyage = "voyage.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["voyage*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "C4", "DTZ", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

# Heavy optional deps (GPU/CPU model stacks): never follow them — treat as
# Any in every image. `ignore_missing_imports` covers images without them
# (slim gates), `follow_imports = "skip"` covers images with them
# (director/video), where an inline `type: ignore` would be unused.
[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "acestep",
  "acestep.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
markers = [
  "gpu: requires GPU model workers",
  "endurance: long-running stability tests",
]

[project]
name = "voyage"
version = "0.1.0"
description = "Autonomous infinite audiovisual voyage — supervisor + workers (Phase 0 skeleton)"
requires-python = ">=3.10"
dependencies = [
  # Pinned exact (issue 011/083): versions below are the 2026-09-25 slim-image
  # freeze (`docker run --rm voyage:latest pip freeze`, recorded in
  # requirements.lock). The pydantic upper bound is a cross-image contract,
  # not just reproducibility: the video/director workers pin
  # `pydantic>=2.7,<2.11`, so the supervisor must validate the shared
  # WorkerRequest/WorkerResponse wire types under the same range (issue 083).
  # To upgrade: bump here, rebuild, re-freeze into requirements.lock.
  "pydantic>=2.7,<2.11",
  "huggingface_hub==2.0.0",
  # 1.x line, not 2.x, on purpose (issue 087): numpy 2.5.x ships .pyi
  # stubs using 3.12-only `type`-statement syntax, which mypy under the
  # 3.10 target cannot even parse (and mypy 2.3.1 parses the stub despite
  # follow_imports=skip — verified live). 1.26.4 keeps old-syntax stubs
  # and cp310 wheels, so the type target and the video runtime agree.
  "numpy==1.26.4",
  "rich==15.0.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  # Pinned exact like the runtime deps above (issue 011): gate behavior
  # must not drift between rebuilds (ruff >=0.5 spans a year of new rules).
  "pytest==9.1.1",
  "mypy==2.3.1",
  "ruff==0.16.9",
  # Property tests (issue 039) + coverage ratchet (issue 041): same style —
  # exact pins so gate behavior never drifts between rebuilds.
  "hypothesis==6.168.0",
  "coverage==7.16.1",
  # Parallel test execution (2026-10-04 speedup: 32-core box runs the
  # 2000-test suite ~10x faster with `-n auto`; scripts/test.sh passes it
  # by default). Exact pin like the rest — gate behavior must not drift.
  "pytest-xdist==3.8.0",
  # Parallel-aware coverage for the xdist run (plain `coverage run` only
  # measures the controller process, not the workers). Same exact-pin rule.
  "pytest-cov==7.1.0",
]

[project.scripts]
voyage = "voyage.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["voyage*"]

[tool.ruff]
line-length = 100
# Minimum supported runtime is the video worker's Python 3.10
# (worker/Dockerfile.video installs python3.10), so lint targets 3.10:
# targeting 3.12 would bless 3.11+ idioms (e.g. datetime.UTC) that crash
# the video image with no gate catching it (issue 087).
target-version = "py310"
# issues/ holds verbatim evidence quotes — ruff format rewrites md fences
# (e.g. wraps expressions in parens), corrupting them. Never format it
# (ruff check ignores markdown already, so lint coverage is unaffected).
exclude = ["issues/"]

[tool.ruff.lint]
# Issue 034: the high-value families beyond the original nine (BLE blind-
# except, TRY/EM exception style, SIM simplify, RUF100 self-policing,
# S101 shipped asserts, T201 print-as-interface). The concurrent
# no-mass-fix constraint stands: files outside the 034 scope carry
# per-file exemptions below, each a follow-up in issues/034 — delete the
# entry (not the rule) as the owning pass converts the file.
# Issue 031 (ACCEPTED-RESIDUAL 2026-10-01): green `ruff check .` covers
# these 16 families only — ANN,D,PLR2004-full,PT,S,PERF,N stay dark
# (PERF 11 / N 51 / PT 112 as-read 2026-10-01). Retry order PERF->N->PT
# once the owning tracks clear the blocking sites (supervisor + worker/
# test owners); adopting a family needs EVERY site in clean owned files.
select = ["E", "F", "I", "UP", "B", "A", "C4", "DTZ", "W", "BLE", "TRY", "EM", "SIM", "RUF100", "S101", "T201"]
ignore = [
  # Zoomy parity: user-facing error messages embed values inline and read
  # better as literals (EM101/EM102), and carry context in the exception
  # string itself (TRY003).
  "EM101",
  "EM102",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Zoomy parity: asserts are the test interface, prints are the script
# interface (voyage scripts report progress to stdout).
"tests/*" = ["S101"]
"scripts/*" = ["T201"]
# Issue 034 follow-ups (un-ignore as the owning pass converts each file):
"voyage/tui.py" = ["BLE", "SIM105", "SIM117", "T201", "RUF100"]
"voyage/supervisor.py" = ["BLE", "SIM105", "S101", "RUF100"]
"voyage/cli.py" = ["BLE", "SIM105", "S101", "T201", "F401"]
# Issue 080/082 shims: cli.py + model_registry.py are backward-compat
# re-export seams over the verb-group / family modules — every F401 here
# is an intentional re-export (parity-pinned by tests/test_cli_split.py +
# tests/test_registry_split.py), never a dead import. The cli_* fragments
# mirror cli.py's contract (same moved code); registry_records mirrors
# model_registry.py's.
"voyage/cli_*.py" = ["BLE", "SIM105", "S101", "T201"]
"voyage/registry_records.py" = ["S101"]
"voyage/doctor.py" = ["BLE", "RUF100"]
"voyage/config.py" = ["TRY004"]
"voyage/logrotate.py" = ["TRY300", "RUF100"]
"voyage/concepts.py" = ["SIM105", "RUF100"]
"voyage/prompts.py" = ["SIM108"]
"voyage/tui_state.py" = ["SIM103"]
"voyage/model_registry.py" = ["S101", "F401"]
"voyage/persistence.py" = ["RUF100"]
"voyage/media.py" = ["T201"]
"voyage/sfx_finalize.py" = ["T201"]
"voyage/models_ensure.py" = ["BLE"]
"voyage/workers/loop.py" = ["BLE", "T201"]
"voyage/workers/director.py" = ["BLE", "TRY004", "TRY300", "RUF100", "T201"]
"voyage/workers/video_causvid.py" = ["BLE", "TRY004", "S101", "T201"]
"voyage/workers/video_ltxv.py" = ["TRY004", "TRY301", "S101", "T201", "RUF100"]
"voyage/workers/video_ltx25.py" = ["TRY004", "S101", "T201"]
"voyage/workers/video_ltx23.py" = ["TRY004", "S101", "T201"]
"voyage/workers/augment_worker.py" = ["T201"]
"voyage/workers/audio_acestep.py" = ["TRY004"]
"tests/test_observability.py" = ["RUF100"]
"tests/test_backend_registry.py" = ["SIM300"]
"tests/test_causvid_prep.py" = ["SIM300"]
"tests/test_commit_hardening.py" = ["SIM105"]
"tests/test_console.py" = ["SIM117"]
"tests/test_doctor.py" = ["SIM300"]
"tests/test_tui_app.py" = ["SIM108"]
"tests/test_tui_state.py" = ["SIM300"]

[tool.mypy]
# Minimum supported runtime, mirroring the ruff target above (issue 087).
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true

# Version-gapped stdlib + stub-syntax (issue 087): `tomllib` exists only
# on 3.11+, so the 3.10 target cannot resolve it (the code's try/except
# ImportError + tomli fallback is the runtime answer). numpy is pinned to
# the 1.x line above for the same reason (2.x stubs need 3.12 to parse);
# if numpy ever moves back to 2.x, re-add it here with follow_imports.
[[tool.mypy.overrides]]
module = [
  "tomllib",
  "tomli",
]
ignore_missing_imports = true
follow_imports = "skip"

# Heavy optional deps (GPU/CPU model stacks): never follow them — treat as
# Any in every image. `ignore_missing_imports` covers images without them
# (slim gates), `follow_imports = "skip"` covers images with them
# (director/video), where an inline `type: ignore` would be unused.
# `numpy` rides in the same list for a different reason (issue 035): its
# installed stubs use the 3.12 `type` statement, which mypy cannot even
# parse under this project's 3.10 target — following it breaks every mypy
# run at the import (verified live), so it is treated as Any until
# upstream ships 3.10-clean stubs or the floor is raised.
[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "acestep",
  "acestep.*",
  "accelerate",
  "accelerate.*",
  "mmaudio",
  "mmaudio.*",
  "open_clip",
  "open_clip.*",
  "soundfile",
  "soundfile.*",
  "PIL",
  "PIL.*",
  "comfy",
  "comfy.*",
  "folder_paths",
  "nodes",
  "execution",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
markers = [
  "gpu: requires GPU model workers",
  "endurance: long-running stability tests",
  # Issue 089: registered so the SLOW tail (Pilot suites, ffmpeg
  # pairwise/concat, multi-commit runs) can be marked and deselected with
  # `-m "not slow"`. No test carries it yet — tail marking is the residual
  # below, kept out so this registration changes no suite behavior.
  "slow: load-sensitive or multi-second tests",
]

[tool.coverage.run]
# Issue 041: coverage data must never land in the bind-mounted tree (a bare
# --cov run once wrote a root-owned .coverage there); /tmp always exists
# in every gate image. Read via COVERAGE_DATA_FILE only when parallelizing.
source = ["voyage"]
data_file = "/tmp/voyage-coverage-data"

[tool.coverage.report]
show_missing = true
# Issue 041: ratchet — 73% (measured 76% total 2026-09-30 with the fake
# backends, 10342 stmts; GPU worker bodies are uncovered by design:
# workers/ 64%, audio/ 68%, top-level cores mostly 80-100%). Floor is
# measured-minus-3 slack: any >3-point regression fails `coverage report`.
# Raise toward the measured total as worker coverage grows; per-directory
# floors (workers vs cores) are the documented next step (see issues/041).
fail_under = 73

volumes:
  comfy:
    external: true
  zoomy_models:
  # Persisted mypy cache: quality-gates.sh mounts this at /tmp/mypy-cache so
  # repeat runs reuse type-check results (~1 s warm vs ~36 s cold). The cache
  # is content+mtime keyed and lives outside the tree, so it never pollutes
  # the repo. Safe to drop any time (docker volume rm).
  zoomy_mypy_cache:

services:
  comfy:
    image: comfy
    build: .
    ports:
      - 8188:8188
      - 7860:7860
      - 9000:9000
    volumes:
      - ./input:/input
      - ./Comfy:/comfy
      - comfy:/root/.cache
    init: true
    healthcheck:
      test: curl --fail http://localhost:8188 && curl --fail http://localhost:9000/status
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  zoomy:
    image: zoomy
    build: ./Zoomy
    ports:
      - 7861:7861
    volumes:
      - ./Zoomy/output:/output
      - zoomy_models:/models
    # Standalone: no dependency on comfy. Models live in the zoomy_models
    # volume (provisioned once via `python scripts/download_models.py`);
    # hub files and ACE-Step checkpoints self-populate there on first use
    # via HF_HOME and the music project directory below.
    environment:
      ZOOMY_OUTPUT_DIRECTORY: /output
      ZOOMY_SEED_DIRECTORY: /models/seed
      ZOOMY_MUSIC_PROJECT_DIRECTORY: /models/music-project
      HF_HOME: /models/.hf-cache
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      CIVITAI_API_KEY: ${CIVITAI_API_KEY:-}
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: curl --fail http://localhost:7861/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
